name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  services-python:
    name: services · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-campaigns
          - api-metrics
          - api-plans
          - api-profiles
          - api-progressive-dialer
          - api-segments
          - api-sms
          - shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: an unpinned install lets a tool release change the gate. Rule
      # selection lives in each service's ruff.toml, not in ruff's shifting defaults.
      - run: pip install ruff==0.15.5 pytest==8.4.2 boto3
      - name: install service deps (if declared)
        run: |
          if [ -f "services/${{ matrix.service }}/requirements.txt" ]; then
            pip install -r "services/${{ matrix.service }}/requirements.txt"
          fi
      - name: ruff
        run: ruff check services/${{ matrix.service }}
      - name: pytest
        working-directory: services/${{ matrix.service }}
        run: python3 -m pytest -q

  # infra/ has no working build/lint/test scripts wired (tsconfig.json and
  # jest.config.js referenced by package.json don't exist). The real, working
  # entry point is `cdk synth` (via ts-node, per cdk.json) — that's what
  # actually validates the CDK app compiles and every stack resolves.
  infra-synth:
    name: infra · cdk synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx cdk synth --quiet

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
