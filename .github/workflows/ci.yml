name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  services-python:
    name: services · ${{ matrix.service }}
    runs-on: ubuntu-latest
    env:
      # boto3 requires a region even for moto-mocked (offline) tests -- without
      # this, any handler that instantiates a client at import time fails
      # collection with botocore.exceptions.NoRegionError before a single test
      # runs. Never set here before; api-metrics/api-plans/api-progressive-dialer
      # only "passed" locally for whoever had AWS_REGION/AWS_PROFILE in their
      # own shell env, never in CI itself.
      AWS_DEFAULT_REGION: us-east-1
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-campaigns
          - api-metrics
          - api-plans
          - api-profiles
          - api-progressive-dialer
          - api-segments
          - api-sms
          - shared
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Pinned: an unpinned install lets a tool release change the gate. Rule
      # selection lives in each service's ruff.toml, not in ruff's shifting defaults.
      - run: pip install ruff==0.15.5 pytest==8.4.2 pytest-mock==3.15.1 boto3
      - name: install service deps (if declared)
        run: |
          if [ -f "services/${{ matrix.service }}/requirements.txt" ]; then
            pip install -r "services/${{ matrix.service }}/requirements.txt"
          fi
      - name: ruff
        run: ruff check services/${{ matrix.service }}
      - name: pytest
        working-directory: services/${{ matrix.service }}
        run: python3 -m pytest -q

  # infra/ has no working build/lint/test scripts wired (tsconfig.json and
  # jest.config.js referenced by package.json don't exist). The real, working
  # entry point is `cdk synth` (via ts-node, per cdk.json) — that's what
  # actually validates the CDK app compiles and every stack resolves.
  infra-synth:
    name: infra · cdk synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx jest --config infra/jest.config.js
      - run: npx cdk synth --quiet

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
