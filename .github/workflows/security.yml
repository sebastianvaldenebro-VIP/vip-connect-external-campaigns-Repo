name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # gitleaks-action's PR mode calls GET /pulls/{n}/commits, which 403s
  # ("Resource not accessible by integration") without this.
  pull-requests: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Semgrep SAST (OWASP Top 10 + auto rules)
        run: |
          pip install semgrep
          semgrep scan --config p/owasp-top-ten --config auto --error

      - name: GitLeaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: '1'

  iac:
    name: CDK IaC scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx cdk synth --quiet
      - name: Checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0
        with:
          directory: cdk.out
          framework: cloudformation
          quiet: true
          soft_fail: false
